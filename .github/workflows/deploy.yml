name: Deploy (Cloudflare)

on:
  push:
    branches: [main, claude/lucid-fermi-t1ng6n]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secrets prüfen
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          # Öffentliche Werte (Projekt-URL und publishable Key stehen ohnehin im Browser, RLS schützt die Daten).
          # Standard = Projekt «Zinkbad»; mit Repository-Variablen überschreibbar. Nie den service_role-Key hier eintragen.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://kdnxaiysxelksfrepnui.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_tqLhT23zax1BakMyHP1Tgw_BQlpB6q7' }}
          NEXT_PUBLIC_INDEXABLE: ${{ vars.NEXT_PUBLIC_INDEXABLE }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
